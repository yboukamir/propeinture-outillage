<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/roller.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="ProPeinture Outillage — projet de démonstration : concept de boutique d'outillage et matériel pour peintres professionnels."
    />
    <title>ProPeinture Outillage — Démo</title>
    <script>
      // Avant le premier rendu, sinon la page apparaît en clair puis bascule.
      // Volontairement en ligne et sans dépendance : ce script doit s'exécuter
      // avant la feuille de styles et le bundle.
      ;(function () {
        try {
          var choix = localStorage.getItem("propeinture-theme")
          var sombre = choix
            ? choix === "sombre"
            : matchMedia("(prefers-color-scheme: dark)").matches
          document.documentElement.dataset.theme = sombre ? "dark" : "light"
        } catch (e) {
          document.documentElement.dataset.theme = "light"
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
